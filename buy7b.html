<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Buy Notes — Mathematics Hub</title>

<style>
/* ---------- Base ---------- */
body { 
  font-family: Arial, sans-serif; 
  background: #f0f8ff; 
  margin: 0; 
  padding: 0; 
  color: #000; 
  transition: background 0.25s ease, color 0.25s ease; 
}

/* Header & Footer */
.header-wrapper, .footer-wrapper { 
  background: linear-gradient(135deg, #6a11cb, #2575fc); 
  padding: 12px; 
}
.header, .footer { 
  background: #FFFFCC; 
  padding: 15px; 
  text-align: center; 
  font-size: 20px; 
  font-weight: bold; 
  border: 2px solid #333; 
  border-radius: 10px; 
  max-width: 600px; 
  margin: auto; 
  text-shadow: 2px 2px 4px #888;
}

.header small{
  display:block;
  font-size:13px;
  font-weight:normal;
  margin-top:6px;
  color:#333;
}

/* Wrapper */
.wrap { max-width: 940px; margin: 20px auto; padding: 0 12px; }

/* Box */
.box{
  background:#fff;
  border:2px solid #2575fc;
  padding:20px;
  border-radius:12px;
  margin:15px;
  box-shadow:0 0 10px rgba(0,0,0,0.1);
}
.box h2{ margin-top:0; color:#0b2447; }

/* Pay Button */
.pay-btn{
  display:block;
  background:#2575fc;
  color:white;
  padding:12px 18px;
  border-radius:10px;
  font-size:18px;
  font-weight:bold;
  text-align:center;
  text-decoration:none;
  margin-top:15px;
}

/* Theme */
.theme-wrap { display:flex; justify-content:center; margin:18px 0; }

#themeSelect {
  padding:8px 16px;
  border-radius:6px;
  font-weight:bold;
  background-color:#555;
  color:#fff;
  border:none;
  cursor:pointer;
}

/* 🔥 SAME SIZE BUTTONS */
.nav-btn{
  display:inline-block;
  width:220px; /* SAME SIZE FIX */
  text-align:center;
  padding:12px 0;
  background:#ff5722;
  color:#fff;
  font-weight:bold;
  border-radius:25px;
  text-decoration:none;
  transition:all 0.25s ease;
  box-shadow:0 4px 10px rgba(0,0,0,0.15);
  margin:6px;
}

.nav-btn:hover{
  background:#e64a19;
  transform:translateY(-3px) scale(1.03);
  box-shadow:0 8px 18px rgba(0,0,0,0.25);
}

/* DARK MODE */
body.dark{ background:#0f1724; color:#d1d5db; }

body.dark .header, 
body.dark .footer{
  background:#1e293b;
  color:#e2e8f0;
  border-color:#334155;
  text-shadow:none;
}

body.dark .box{ background:#1e293b; border-color:#334155; }

body.dark .box h2{ color:#facc15; }

body.dark .pay-btn{ background:#2563eb; }

body.dark #themeSelect{
  background-color:#334155;
  color:#d1d5db;
  border:1px solid #475569;
}

body.dark .nav-btn{
  background:#f97316;
}

body.dark .nav-btn:hover{
  background:#ea580c;
}
</style>

</head>

<body>

<!-- HEADER -->
<div class="header-wrapper">
  <div class="header">
    Buy Notes — Class 7
    <small> Notes • NCERT Solutions • Practice Papers </small>
  </div>
</div>

<!-- THEME BUTTON -->
<div class="theme-wrap">
  <select id="themeSelect">
    <option value="light">🌞 Light Mode</option>
    <option value="dark">🌙 Dark Mode</option>
  </select>
</div>

<div class="wrap">

  <div class="box">
    <h2 id="chapterName">Loading...</h2>

    <p id="priceText" style="font-size:18px; margin-bottom:15px;"></p>

    <!-- SCANNER -->
    <div style="margin-top:20px; padding:18px; border:2px solid #2575fc; border-radius:16px; background:#0a0f1f; box-shadow:0 0 25px #2575fcaa;">
      <h3 style="margin:0 0 12px; font-size:20px; color:#fff; text-align:center;">
        📷 Scan & Pay Instantly
      </h3>

      <img src="https://raw.githubusercontent.com/dalbir46/Awareness_Academy/main/default.jpg"
           style="width:100%; border-radius:12px; border:2px solid #2575fc;">

      <a href="upi://pay?pa=dalbir46@pnb&pn=Awareness%20Academy&cu=INR"
         style="display:block; margin-top:18px; text-align:center; padding:14px; font-size:18px; color:white; background:linear-gradient(45deg,#1e3c72,#2575fc); border-radius:10px; text-decoration:none;">
         💸 Proceed to Payment by scanner 
      </a>
    </div>

    <a id="payLink" class="pay-btn" target="_blank">Proceed to Pay by upi</a>
  </div>

  <!-- 🔥 BOTH SAME SIZE BUTTONS -->
  <div style="text-align:center; margin-top:20px;">
    <a href="https://dalbir46.github.io/Awareness_Academy/part2.html" class="nav-btn">⬅ Back to Chapters</a>
    <a href="https://dalbir46.github.io/6to12/" class="nav-btn">🏠 Back to Home</a>
  </div>

</div>

<!-- FOOTER -->
<div class="footer-wrapper">
  <div class="footer">
    © 2026 Mathematics Hub — Class 7
  </div>
</div>

<script>
// THEME
const themeSelect = document.getElementById('themeSelect');
const savedTheme = localStorage.getItem('theme') || 'light';

if (savedTheme === 'dark') {
  document.body.classList.add('dark');
  themeSelect.value = 'dark';
}

themeSelect.addEventListener('change', function() {
  const mode = this.value;

  if (mode === 'dark') {
    document.body.classList.add('dark');
  } else {
    document.body.classList.remove('dark');
  }

  localStorage.setItem('theme', mode);
});

// Chapter logic
const urlParams = new URLSearchParams(window.location.search);
const chapter = urlParams.get('ch') || "Selected Chapter";

document.getElementById("chapterName").innerText = "Buy Notes — " + chapter;

const priceList = {
  "1": 14,
  "2": 16,
  "3": 11,
  "4": 45,
  "5": 20,
  "6": 35,
  "7": 29
};

const amount = priceList[chapter] || 39;

document.getElementById("priceText").innerHTML =
  "Price: <b>₹" + amount + "</b>";

document.getElementById("payLink").href =
  "upi://pay?pa=dalbir46@pnb&pn=" + encodeURIComponent(chapter) +
  "&am=" + amount + "&cu=INR";
</script>

</body>
  </html>
