<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Buy Notes — Class 9 | Mathematics Hub</title>

<style>
body { 
  font-family: Arial, sans-serif; 
  background: #f0f8ff; 
  margin: 0; 
  padding: 0; 
  color: #000; 
  transition: background 0.25s ease, color 0.25s ease; 
}

.header-wrapper, .footer-wrapper { 
  background: linear-gradient(135deg, #6a11cb, #2575fc); 
  padding: 12px; 
}
.header, .footer { 
  background: #FFFFCC; 
  padding: 15px; 
  text-align: center; 
  font-size: 20px; 
  font-weight: bold; 
  border: 2px solid #333; 
  border-radius: 10px; 
  max-width: 600px; 
  margin: auto; 
}

.wrap { max-width: 940px; margin: 20px auto; padding: 0 12px; }

.box{
  background:#fff;
  border:2px solid #2575fc;
  padding:20px;
  border-radius:12px;
  margin:15px;
  box-shadow:0 0 10px rgba(0,0,0,0.1);
}
.box h2{ margin-top:0; color:#0b2447; }

.pay-btn{
  display:block;
  background:#2575fc;
  color:white;
  padding:12px 18px;
  border-radius:10px;
  font-size:18px;
  font-weight:bold;
  text-align:center;
  text-decoration:none;
  margin-top:15px;
}

.theme-wrap { display:flex; justify-content:center; margin:18px 0; }
#themeSelect {
  padding:8px 16px;
  border-radius:6px;
  background:#555;
  color:#fff;
}

body.dark{ background:#0f1724; color:#d1d5db; }
body.dark .box{ background:#1e293b; border-color:#334155; }
body.dark .box h2{ color:#facc15; }
body.dark .pay-btn{ background:#2563eb; }
</style>
</head>

<body>

<div class="header-wrapper">
  <div class="header">Buy Notes — Class 9</div>
</div>

<div class="theme-wrap">
  <select id="themeSelect">
    <option value="light">🌞 Light</option>
    <option value="dark">🌙 Dark</option>
  </select>
</div>

<div class="wrap">

  <div class="box">
    <h2 id="chapterName">Loading...</h2>

    <p id="priceText" style="font-size:18px; margin-bottom:15px;"></p>

    <!-- SCANNER -->
    <div style="
      margin-top:20px; 
      padding:18px; 
      border:2px solid #2575fc; 
      border-radius:16px;
      background:#0a0f1f;
      box-shadow:0 0 25px #2575fcaa;
    ">
      <h3 style="
        margin:0 0 12px; 
        font-size:20px; 
        color:#ffffff;
        text-align:center;
        text-shadow:0 0 8px #2575fc;
      ">
        📷 Scan & Pay Instantly
      </h3>

      <img 
        src="https://raw.githubusercontent.com/dalbir46/Awareness_Academy/main/default.jpg"
        alt="Scanner QR"
        style="
          width:100%;
          border-radius:12px;
          border:2px solid #2575fc;
          box-shadow:0 0 20px #2575fcaa;
        "
      >

      <a href="upi://pay?pa=dalbir46@pnb&pn=Awareness%20Academy&cu=INR" 
         style="
           display:block;
           margin-top:18px;
           text-align:center;
           padding:14px;
           font-size:18px;
           color:white;
           background:linear-gradient(45deg,#1e3c72,#2575fc);
           border-radius:10px;
           text-decoration:none;
           font-weight:bold;
           box-shadow:0 0 25px #2575fcaa;
         ">
         💸 Proceed to Payment by Scanner
      </a>
    </div>

    <a id="payLink" class="pay-btn" target="_blank">Proceed to Pay by UPI</a>
  </div>

  <div style="text-align:center; margin-top:20px;">
    <a href="class9.html" style="color:#2575fc; font-weight:bold;">⬅ Back to Chapters</a>
  </div>

</div>

<div class="footer-wrapper">
  <div class="footer">© 2025 Mathematics Hub — Class 9</div>
</div>

<script>
/* THEME */
const themeSelect = document.getElementById('themeSelect');
const savedTheme = localStorage.getItem('theme') || 'light';
if(savedTheme==='dark'){ document.body.classList.add('dark'); themeSelect.value='dark'; }
themeSelect.addEventListener('change', ()=>{
  document.body.classList.toggle('dark', themeSelect.value==='dark');
  localStorage.setItem('theme', themeSelect.value);
});

/* CHAPTER NAME */
const urlParams = new URLSearchParams(window.location.search);
const chapter = urlParams.get('ch') || "Selected Chapter";
document.getElementById("chapterName").innerText = "Buy Notes — " + chapter;

/* CLASS 9 PRICE LIST */
const priceList = {
  "Number Systems": 25,
  "Polynomials": 29,
  "Coordinate Geometry": 29,
  "Linear Equations": 35,
  "Euclid Geometry": 25,
  "Lines and Angles": 29,
  "Triangles": 35,
  "Quadrilaterals": 35,
  "Circles": 29,
  "Heron Formula": 25,
  "Surface Areas": 39,
  "Statistics": 25
};

const amount = priceList[chapter] || 29;

document.getElementById("priceText").innerHTML =
  "Price: <b>₹" + amount + "</b>";

document.getElementById("payLink").href =
  "upi://pay?pa=dalbir46@pnb&pn=" + encodeURIComponent(chapter) +
  "&am=" + amount + "&cu=INR";
</script>

</body>
      </html>
