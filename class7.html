<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Class 7 — Mathematics Hub</title>

<style>
body { 
  font-family: Arial, sans-serif; 
  background: #f0f8ff; 
  margin: 0; 
  padding: 0; 
  color: #000; 
  transition: 0.3s;
}

/* Dark Mode */
body.dark {
  background: #121212;
  color: #fff;
}

/* Header & Footer */
.header-wrapper, .footer-wrapper { 
  background: linear-gradient(135deg, #6a11cb, #2575fc); 
  padding: 12px; 
}
.header, .footer { 
  background: #FFFFCC; 
  padding: 15px; 
  text-align: center; 
  font-size: 20px; 
  font-weight: bold; 
  border: 2px solid #333; 
  border-radius: 10px; 
  text-shadow: 2px 2px 4px #888888; 
  max-width: 600px; 
  margin: auto; 
}
.header small { display:block; font-size:13px; font-weight:normal; margin-top:6px; color:#333; }

.wrap { max-width: 940px; margin: 20px auto; padding: 0 12px; }

/* Dropdown */
.mode-select {
  display:block;
  margin: 10px auto;
  padding: 8px;
  border-radius: 6px;
  font-weight: bold;
}

/* Part Boxes */
.parts {
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin: 20px 10px;
}
.part-box {
  flex:1;
  min-width:140px;
  text-align:center;
  padding:15px;
  background:#2575fc;
  color:#fff;
  border-radius:10px;
  text-decoration:none;
  font-weight:bold;
  transition:0.3s;
}
.part-box:hover {
  background:#1a5ed8;
}

/* Back Button */
.b18 {
  padding: 12px 20px;
  background: #ff5722;
  color: #fff;
  border-radius: 25px;
  text-decoration: none;
  font-weight: bold;
  display: inline-block;
  transition: background 0.3s ease;
}
.b18::before { content: "🏠 "; }
.b18:hover { background: #e64a19; }
</style>
</head>

<body>

<!-- Header -->
<div class="header-wrapper">
  <div class="header">
    Mathematics Hub — Class 7
    <small>Notes • NCERT Solutions • Practice Papers</small>
  </div>
</div>

<div class="wrap">

  <!-- Mode Dropdown -->
  <select class="mode-select" onchange="changeMode(this.value)">
    <option value="light">🌞 Light Mode</option>
    <option value="dark">🌙 Dark Mode</option>
  </select>

  <!-- Part Selection -->
  <div class="parts">
    <a href="part1.html" class="part-box">Part 1</a>
    <a href="part2.html" class="part-box">Part 2</a>
    <a href="oldncert.html" class="part-box">Old NCERT</a>
  </div>

  <!-- Back to home -->
  <div style="text-align:center; margin:30px 0;">
    <a href="index.html" class="b18">Back to Home</a>
  </div>

</div>

<!-- Footer -->
<div class="footer-wrapper">
  <div class="footer">
    © 2025 Mathematics Hub — Class 7
  </div>
</div>

<script>
function changeMode(mode){
  if(mode === "dark"){
    document.body.classList.add("dark");
  } else {
    document.body.classList.remove("dark");
  }
}
</script>

</body>
      </html>
